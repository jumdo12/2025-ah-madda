spring:
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 1s
      timeout: 1s

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ahmadda?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ahmadda
    password: 1234

  jpa:
    show-sql: true
    properties:
      hibernate:
        detector:
          enabled: true
    hibernate:
      ddl-auto: validate

  cloud:
    aws:
      s3:
        region: ap-northeast-2

jwt:
  access:
    secret-key: local-access-secret-key-for-portfolio-only
    expiration: 1h
  refresh:
    secret-key: local-refresh-secret-key-for-portfolio-only
    expiration: 14d

cookie:
  refresh-token:
    path: /
    domain: localhost
    same-site: None
    secure: true
    http-only: true
    ttl: 14d

cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

notification:
  redirect-url-prefix: http://localhost:5173/

mail:
  noop: true

push:
  noop: true

slack:
  noop: true

aws:
  s3:
    noop: true
    bucket: local-bucket
    folder: local/
