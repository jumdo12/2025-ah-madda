server:
  port: 8080
  tomcat:
    max-http-form-post-size: 2MB

spring:
  application:
    name: ah-madda

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    properties:
      hibernate.default_batch_fetch_size: 16

oauth:
  google:
    client-id: local-google-client-id
    client-secret: local-google-client-secret
    token-uri: https://oauth2.googleapis.com/token
    user-uri: https://www.googleapis.com/oauth2/v3/userinfo
    connect-timeout: 3000
    read-timeout: 5000

smtp:
  google:
    host: localhost
    port: 587
    username: local-google-smtp-user
    password: local-google-smtp-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 5000

  aws:
    host: localhost
    port: 587
    username: local-aws-smtp-user
    password: local-aws-smtp-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      primaryEmail:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 2m
        permittedNumberOfCallsInHalfOpenState: 3

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /specification
    operations-sorter: method
    persist-authorization: true

event-participation:
  stream:
    consumer:
      enabled: true

rate-limit:
  member:
    capacity: 30
    refill-period: 1m
    maximum-cache-size: 100000
    expire-after-access: 10m

management:
  metrics:
    enable:
      all: false
  endpoints:
    web:
      exposure:
        include:
          - health
    jmx:
      exposure:
        exclude: '*'

slack:
  bot-token: local-slack-bot-token
  channel-id: local-slack-channel
  post-message-url: http://localhost/slack
  connect-timeout: 3000
  read-timeout: 5000
